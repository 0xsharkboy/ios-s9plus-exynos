# devices/beyond2lte/device.conf: the Samsung Galaxy S10+ (SM-G975F, Exynos 9820). docs/beyond2lte-bringup.md has where each
# fact came from. Every area is "missing" because nothing has been seen working on this phone; each note says what is known of it.
# NO KERNEL HAS RUN ON AN S10+.

device beyond2lte
	title       Galaxy S10+
	vendor      Samsung
	soc         exynos9820
	defconfig   beyond2lte_defconfig
	maintainer  0xsharkboy (README.md)
	status      display     partial   UEFI's framebuffer, 1440 x 3040 at 0xCA000000, seen through the loader's start; a kernel's use of it not seen; DECON at 0x19030000, the S9's driver not built
	status      cpu         missing   A55s 2 and 3 (cpus=2 bootcpu=2) as a first choice: not seen
	status      touch       missing   sec_ts, firmware y771_beyond2_phole, at 0x48 on HSI2C 0x104B0000, the S9's bus and address; the protocol is unconfirmed; driver not built
	status      buttons     missing   driver not built
	status      storage     missing   Silicium's S10 UEFI has no UFS; the controller is at 0x13D60000; needs the kernel's own driver
	status      gpu         missing   Mali-G76 MP12, 0x7211, at 0x18500000, known to Mesa 25.0.7; supply on the S2MPS19 not established; driver not built
	status      audio       missing   CS47L93 codec as on the S9, CS35L40 amplifiers: no driver
	status      battery     missing   MAX77705 as on the S9, 4100 mAh; driver not built
	status      wifi        missing   BCM4375, 14e4:4475 on PCIe: no driver
	status      bluetooth   missing   BCM4375: no driver
	status      cellular    missing
	status      thermal     missing
	status      camera      missing
	status      torch       missing
	status      usb         missing   DWC3 at 0x10C00000, the S9's address; PHY and clocks not compared; driver not built
